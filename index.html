<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanças K&amp;E</title>
<meta name="theme-color" content="#6d5df6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #f5f3ff; font-family: system-ui, sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #aviso { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
           gap: 14px; padding: 24px; text-align: center; color: #1e1b4b; }
  #aviso a { background: linear-gradient(135deg, #6d5df6, #f472b6); color: #fff; text-decoration: none; font-weight: 700;
             padding: 14px 22px; border-radius: 16px; }
  #carregando { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #7c7a9c; font-weight: 600; }
</style>
</head>
<body>
<div id="carregando">Abrindo Finanças K&amp;E…</div>
<div id="aviso">
  <div style="font-size:42px">⚙️</div>
  <b>Falta configurar o link do app.</b>
  <span>Edite o arquivo index.html e cole o link da implantação (termina em /exec).</span>
</div>
<script>
  /* ===== COLE AQUI O LINK DO APP (Implantar > Gerenciar implantações > URL do app da Web) ===== */
  var LINK_DO_APP = 'https://script.google.com/macros/s/AKfycbyyYRqOBbEY-6tBEfq7guLfvFRbC2tnTKChIi0wVITGyTs6yXy4miCFVnhJr6vW4_CwjQ/exec';

  if (LINK_DO_APP.indexOf('https:') !== 0) {
    document.getElementById('carregando').style.display = 'none';
    document.getElementById('aviso').style.display = 'flex';
  } else {
    var f = document.createElement('iframe');
    f.src = LINK_DO_APP;
    f.allow = 'clipboard-write';
    f.onload = function () { document.getElementById('carregando').style.display = 'none'; };
    document.body.appendChild(f);
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
</script>
</body>
</html>
